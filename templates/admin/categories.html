{% extends 'layout.html' %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Category Management</h2>
        <a href="{{ url_for('admin_add_category') }}" class="btn btn-success">Add New Category</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td>{{ category.category_id }}</td>
                    <td>{{ category.name }}</td>
                    <td>{{ category.description }}</td>
                    <td>
                        <a href="{{ url_for('admin_edit_category', category_id=category.category_id) }}"
                            class="btn btn-sm btn-warning">Edit</a>

                        <form action="{{ url_for('admin_delete_category', category_id=category.category_id) }}"
                            method="POST" class="d-inline"
                            onsubmit="return confirm('Are you sure? Deleting a category might affect products assigned to it.');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
