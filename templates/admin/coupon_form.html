{% extends "layout.html" %}

{% block title %}Create Coupon{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold text-uppercase"><i class="fas fa-plus-circle me-2"></i>Create New Coupon
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('admin_add_coupon') }}" method="POST">
                        <div class="row g-4">
                            <!-- Basic Info -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Coupon Code</label>
                                <input type="text" name="code"
                                    class="form-control form-control-lg font-monospace text-uppercase"
                                    placeholder="E.G. SAVE20" required maxlength="20">
                                <div class="form-text">Unique code customers enter at checkout.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Discount Type</label>
                                <select name="discount_type" class="form-select form-select-lg">
                                    <option value="percentage">Percentage (%)</option>
                                    <option value="fixed">Fixed Amount (₹)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Discount Value</label>
                                <div class="input-group input-group-lg">
                                    <input type="number" step="0.01" name="discount_value" class="form-control"
                                        placeholder="0.00" required min="0">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Min. Purchase Requirement</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" step="0.01" name="min_purchase" class="form-control"
                                        placeholder="0.00">
                                </div>
                            </div>

                            <hr class="my-3 opacity-10">

                            <!-- Limits & Validity -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small uppercase">Usage Limit</label>
                                <input type="number" name="usage_limit" class="form-control" placeholder="∞">
                                <div class="form-text small">Max times this can be used.</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small uppercase">Valid From</label>
                                <input type="datetime-local" name="valid_from" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small uppercase">Valid Until</label>
                                <input type="datetime-local" name="valid_until" class="form-control">
                            </div>

                            <div class="col-12 mt-5 text-end">
                                <a href="{{ url_for('admin_coupons') }}"
                                    class="btn btn-light btn-lg rounded-pill px-4 me-2 border">Cancel</a>
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5">
                                    Create Coupon Code
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
