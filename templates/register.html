{% extends "layout.html" %}

{% block title %}Register - NK Automobiles{% endblock %}

{% block content %}
<style>
    /* Reuse Login Styles for Consistency */
    .register-section {
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url("{{ url_for('static', filename='images/engine_parts.jpg') }}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 85vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .register-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        border-radius: 20px;
        overflow: hidden;
    }

    .form-control {
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-bottom: 3px solid transparent;
        border-radius: 10px;
        padding: 12px 15px;
    }

    .form-control:focus {
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-bottom: 3px solid #0d6efd;
    }

    .btn-register {
        background: linear-gradient(45deg, #0d6efd, #0043a8);
        border: none;
        padding: 12px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }

    .btn-register::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #0043a8, #0d6efd);
        transition: left 0.3s ease;
        z-index: -1;
    }

    .btn-register:hover::before {
        left: 0;
    }

    .form-label,
    .register-title {
        color: white;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .input-group-text {
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 10px 0 0 10px;
    }
</style>

<div class="register-section">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card register-card p-4 mx-auto" data-aos="zoom-in" data-aos-duration="1000">
                    <div class="card-body">
                        <div class="text-center mb-4" data-aos="fade-down" data-aos-delay="200">
                            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-lg"
                                style="width: 70px; height: 70px;">
                                <i class="fas fa-user-plus fa-2x text-white"></i>
                            </div>
                            <h3 class="card-title fw-bold text-uppercase register-title">Create Account</h3>
                            <p class="text-white-50 small">Join us for the best auto parts experience</p>
                        </div>

                        <form method="POST">
                            <div class="mb-3" data-aos="fade-up" data-aos-delay="300">
                                <label for="username" class="form-label ms-1">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user text-primary"></i></span>
                                    <input type="text" class="form-control" id="username" name="username"
                                        placeholder="Quadri" style="border-radius: 0 10px 10px 0;" required>
                                </div>
                            </div>
                            <div class="mb-3" data-aos="fade-up" data-aos-delay="400">
                                <label for="email" class="form-label ms-1">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope text-primary"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="quadri@example.com" oninput="this.value = this.value.toLowerCase()"
                                        style="text-transform: lowercase; border-radius: 0 10px 10px 0;" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6" data-aos="fade-up" data-aos-delay="500">
                                    <label for="password" class="form-label ms-1">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock text-primary"></i></span>
                                        <input type="password" class="form-control" id="password" name="password"
                                            placeholder="******" style="border-radius: 0 10px 10px 0;" required>
                                    </div>
                                </div>
                                <div class="col-md-6" data-aos="fade-up" data-aos-delay="600">
                                    <label for="confirm_password" class="form-label ms-1">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock text-primary"></i></span>
                                        <input type="password" class="form-control" id="confirm_password"
                                            name="confirm_password" placeholder="******"
                                            style="border-radius: 0 10px 10px 0;" required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mb-3" data-aos="fade-up" data-aos-delay="700">
                                <button type="submit"
                                    class="btn btn-primary btn-register text-white rounded-pill fw-bold text-uppercase shadow-sm">
                                    Register Now <i class="fas fa-arrow-right ms-2"></i>
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4" data-aos="fade-up" data-aos-delay="800">
                            <p class="small text-white-50">Already have an account? <a href="{{ url_for('login') }}"
                                    class="text-white fw-bold text-decoration-none hover-scale">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
