<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Brand badge -->
  <rect x="190" y="50" width="220" height="34" rx="17" fill="#0f172a"/>
  <text x="300" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">NK AUTOMOBILES</text>

  <!-- Spare Part Silhouette Icon (Wrench & Gear) -->
  <g transform="translate(300, 260) scale(1.1)">
    <!-- Gear outer -->
    <path d="M -30,-80 L 30,-80 L 35,-60 A 70,70 0 0,1 60,-35 L 80,-30 L 80,30 L 60,35 A 70,70 0 0,1 35,60 L 30,80 L -30,80 L -35,60 A 70,70 0 0,1 -60,35 L -80,30 L -80,-30 L -60,-35 A 70,70 0 0,1 -35,-60 Z" fill="url(#gearGrad)" opacity="0.85"/>
    <circle cx="0" cy="0" r="38" fill="#f8fafc"/>
    <circle cx="0" cy="0" r="22" fill="#cbd5e1"/>
    
    <!-- Stylized camera / placeholder indicator -->
    <path d="M -24, -10 L -14, -20 L 14, -20 L 24, -10 L 30, -10 A 6,6 0 0,1 36,-4 L 36, 20 A 6,6 0 0,1 30,26 L -30,26 A 6,6 0 0,1 -36,20 L -36,-4 A 6,6 0 0,1 -30,-10 Z" fill="#475569"/>
    <circle cx="0" cy="8" r="10" fill="#f8fafc"/>
    <circle cx="0" cy="8" r="6" fill="#3b82f6"/>
  </g>

  <!-- Text message -->
  <text x="300" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Photograph Pending Verification</text>
  <text x="300" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Physical counter inspection in progress</text>
  
  <rect x="180" y="475" width="240" height="30" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">CATALOG PLACEHOLDER</text>
</svg>
