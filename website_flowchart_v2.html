<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Automobiles - Process Flowchart</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d4d;
            --secondary: #2d3436;
            --accent: #00d2ff;
            --bg-dark: #0f111a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a1c2c 0%, #0f111a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .flow-container {
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .step-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            opacity: 0;
            animation: fadeInRight 0.8s forwards;
        }

        .step-wrapper:nth-child(1) {
            animation-delay: 0.1s;
        }

        .step-wrapper:nth-child(2) {
            animation-delay: 0.3s;
        }

        .step-wrapper:nth-child(3) {
            animation-delay: 0.5s;
        }

        .step-wrapper:nth-child(4) {
            animation-delay: 0.7s;
        }

        .step-wrapper:nth-child(5) {
            animation-delay: 0.9s;
        }

        .step-wrapper:nth-child(6) {
            animation-delay: 1.1s;
        }

        .step-wrapper:nth-child(7) {
            animation-delay: 1.3s;
        }

        .step-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            width: 180px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 2;
        }

        .step-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(255, 77, 77, 0.2);
        }

        .step-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .step-card:hover::before {
            opacity: 1;
        }

        .step-title {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.4;
        }

        .connector {
            width: 50px;
            height: 2px;
            background: linear-gradient(to right, var(--glass-border), var(--primary), var(--glass-border));
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .connector::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, transparent, #fff, transparent);
            animation: flow 2s infinite linear;
        }

        @keyframes flow {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 5rem;
            text-align: center;
            color: #555;
            font-size: 0.8rem;
        }

        @media (max-width: 1100px) {
            .flow-container {
                flex-direction: column;
                gap: 2rem;
            }

            .connector {
                width: 2px;
                height: 40px;
                background: linear-gradient(to bottom, var(--glass-border), var(--primary), var(--glass-border));
            }

            .connector::after {
                top: -100%;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, transparent, #fff, transparent);
                animation: flow-v 2s infinite linear;
            }
        }

        @keyframes flow-v {
            0% {
                top: -100%;
            }

            100% {
                top: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Website Discovery Flow</h1>
        <p>NK Automobiles User Journey</p>
    </div>

    <div class="flow-container">
        <!-- Step 1 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Start<br>(Home Page)</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 2 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Browse /<br>Search Products</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 3 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Add to Cart /<br>View Details</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 4 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Login /<br>Register</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 5 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Checkout<br>(Address)</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 6 -->
        <div class="step-wrapper">
            <div class="step-card">
                <div class="step-title">Payment<br>(UPI/COD)</div>
            </div>
            <div class="connector"></div>
        </div>

        <!-- Step 7 -->
        <div class="step-wrapper">
            <div class="step-card" style="border-color: var(--primary);">
                <div class="step-title" style="color: var(--primary); font-weight: 600;">Order Confirmed</div>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 NK Automobiles. Modernized Workflow Visualization.
    </div>

</body>

</html>
